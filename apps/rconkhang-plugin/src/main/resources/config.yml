# rconkhang config
# Plugin kết nối về backend qua WebSocket (outbound).
# Backend dùng X-Plugin-Key = apiKey trong data.yml để xác thực.

http:
  # HTTP API cho debug local (optional).
  # Khi deploy trên hosting như PikaMC, không có public URL nên disable.
  enabled: false
  host: "127.0.0.1"
  port: 8765

ws:
  # Backend WebSocket URL. Plugin sẽ kết nối outbound tới đây.
  url: "wss://nexora-production-d19d.up.railway.app/ws/plugin"

cors:
  allowed-origins:
    - "https://nexora-production-d19d.up.railway.app"
    - "http://localhost:3000"

log:
  max-history: 200
