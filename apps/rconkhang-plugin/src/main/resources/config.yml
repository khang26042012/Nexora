# rconkhang config
# HTTP API cho panel kết nối
http:
  # Bind address (0.0.0.0 = listen all interfaces)
  host: "127.0.0.1"
  port: 8765
  # API key sẽ tự sinh random khi khởi động lần đầu
  # xem plugins/rconkhang/data.yml để lấy key
  # CẢNH BÁO: KHÔNG expose port này ra internet!

# CORS (cho phép panel domain)
cors:
  allowed-origins:
    - "https://nexora-production-d19d.up.railway.app"
    - "http://localhost:3000"

# Action log
log:
  # Số actions giữ lại trong RAM
  max-history: 200
