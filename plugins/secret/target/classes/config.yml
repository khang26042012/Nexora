# Secret Plugin Configuration
# NexoraMC Server Metrics WebSocket

websocket:
  # WebSocket endpoint URL
  url: "wss://phantrongkhangg.up.railway.app/ws-metrics"
  
  # Enable/disable metrics sending
  enabled: true
  
  # Send interval in seconds
  interval: 2

server:
  # Display name for the server
  name: "NexoraMC"
  
  # Server version string
  version: "Paper 1.21.4"

# Virtual resource scaling (for shared hosting display)
# Actual resources are scaled up for dashboard display
virtual_scaling:
  # RAM: actual 4GB → displayed as 6GB
  ram_max_mb: 6144
  ram_scale_factor: 1.5
  
  # CPU: actual 200% → displayed as 400% max
  cpu_scale_factor: 2.0
