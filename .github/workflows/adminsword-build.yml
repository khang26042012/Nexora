name: Build Plugin (adminsword)

on:
  push:
    branches: [main]
    paths:
      - "apps/adminsword-plugin/**"
      - ".github/workflows/adminsword-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (e.g. 1.0.0). Leave empty to use pom.xml version."
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release adminsword
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -m1 '<version>' apps/adminsword-plugin/pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/' | tr -d '[:space:]')
            if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Build with Maven
        working-directory: apps/adminsword-plugin
        run: mvn -B clean package -DskipTests

      - name: Verify jar
        run: |
          JAR="apps/adminsword-plugin/target/adminsword-${{ steps.version.outputs.version }}.jar"
          if [ ! -f "$JAR" ]; then echo "ERROR: $JAR not found"; ls -la apps/adminsword-plugin/target/*.jar; exit 1; fi
          echo "Built: $JAR"
          echo "Size: $(stat -c%s "$JAR") bytes"
          jar -tf "$JAR" | head -10

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "adminsword-v${{ steps.version.outputs.version }}"
          name: "adminsword v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            apps/adminsword-plugin/target/adminsword-${{ steps.version.outputs.version }}.jar
            apps/adminsword-plugin/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
